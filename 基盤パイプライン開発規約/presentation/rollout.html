<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container { 
      width: 1280px; min-height: 720px; 
      background: #FFFFFF; 
      display: flex; flex-direction: column; 
      padding: 48px;
      font-family: 'Noto Sans JP', sans-serif;
      color: #0B192C;
    }
    h2 { font-size: 32px; font-weight: 700; margin-bottom: 40px; border-left: 8px solid #0B192C; padding-left: 16px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 40px; }
    th { background: #0B192C; color: #FFFFFF; padding: 16px; text-align: left; font-size: 18px; }
    td { border-bottom: 1px solid #E2E8F0; padding: 16px; font-size: 16px; color: #475569; }
    .phase { font-weight: 700; color: #0D9488; }
    .footer-motif { position: absolute; bottom: 24px; left: 48px; right: 48px; border-top: 2px solid #0D9488; padding-top: 12px; display: flex; justify-content: space-between; font-size: 14px; color: #475569; }
  </style>
</head>
<body>
  <div class="slide-container">
    <h2>導入順序と運用開始条件</h2>
    <table>
      <thead>
        <tr>
          <th style="width: 150px;">フェーズ</th>
          <th>対象項目</th>
          <th>統制強度</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="phase">Phase 1</td>
          <td>公開IAM禁止、SAキー作成禁止、必須ラベル、PII分離</td>
          <td><span style="color: #D97706; font-weight: 700;">Critical 拒否</span></td>
        </tr>
        <tr>
          <td class="phase">Phase 2</td>
          <td>パーティション、CMEK、TTL、dry run 費用上限</td>
          <td>警告 ➔ 拒否</td>
        </tr>
        <tr>
          <td class="phase">Phase 3</td>
          <td>Staging 結合テスト、証跡自動収集、継続監視</td>
          <td>標準プロセス化</td>
        </tr>
      </tbody>
    </table>
    <p style="font-size: 18px; line-height: 1.8; color: #0B192C;">
      <b>運用開始条件：</b><br>
      ・基盤、セキュリティ、データ、需給、精算の各責任者による承認<br>
      ・例外管理台帳の整備と有効期限の設定<br>
      ・緊急時のバイパス手順（Break-glass）の確立
    </p>
    <div class="footer-motif">
      <span>Rollout Strategy and Acceptance</span>
      <span>8</span>
    </div>
  </div>
</body>
</html>
