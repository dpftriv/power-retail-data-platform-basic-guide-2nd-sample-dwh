name: Terraform Controls

on:
  pull_request:
    paths: ["terraform/**", "ci-policy-samples/**", ".github/workflows/terraform-controls.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", "ci-policy-samples/**", ".github/workflows/terraform-controls.yml"]

permissions:
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: terraform-controls-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: "1.16.2"
  CONFTEST_VERSION: "0.56.0"
  CHECKOV_VERSION: "3.2.301"
  MAX_BYTES_BILLED: ${{ vars.MAX_BYTES_BILLED || '10737418240' }}

jobs:
  terraform-static:
    name: Terraform fmt validate plan and policy checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: terraform plan -out=tfplan -input=false -no-color
        env:
          TF_VAR_environment: ci

      - name: Export plan as JSON
        run: terraform show -json tfplan > ../artifacts-terraform-plan.json

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: artifacts-terraform-plan.json
          retention-days: 14

      - name: Install Conftest
        working-directory: .
        run: |
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Conftest policy checks
        working-directory: .
        run: |
          conftest verify --policy ci-policy-samples/conftest --namespace terraform.security_cost --namespace terraform.bigquery_schema artifacts-terraform-plan.json

      - name: Install Checkov
        working-directory: .
        run: python -m pip install --disable-pip-version-check "checkov==${CHECKOV_VERSION}"

      - name: Checkov built-in and custom checks
        working-directory: .
        run: |
          checkov -d terraform --framework terraform --external-checks-dir ci-policy-samples/checkov --check CKV_GCP_CUSTOM_001,CKV_GCP_CUSTOM_002,CKV_GCP_CUSTOM_003 --soft-fail false --output cli

      - name: Upload policy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-policy-reports-${{ github.sha }}
          path: artifacts-terraform-plan.json
          retention-days: 14

  sql-and-cost:
    name: SQL/Dataform and BigQuery cost gate
    runs-on: ubuntu-latest
    needs: terraform-static
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SQL lint and static checks
        run: |
          if [ -f package.json ]; then npm ci; fi
          if [ -f package.json ] && npm run | grep -q 'lint:sql'; then npm run lint:sql; fi
          bash ci-policy-samples/scripts/sql-static-check.sh

      - name: Authenticate to Google Cloud
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: BigQuery dry-run cost gate
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        run: |
          find sql models -type f \( -name '*.sql' -o -name '*.sqlx' \) -print0 2>/dev/null | xargs -0 -r -n1 bash ci-policy-samples/scripts/bq-dry-run.sh "${{ vars.CI_GCP_PROJECT }}" "${MAX_BYTES_BILLED}"

  staging-access-and-dq:
    name: Staging access, DQ, and cost regression gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: sql-and-cost
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Run staging policy and access tests
        env:
          STAGING_PROJECT: ${{ vars.STAGING_GCP_PROJECT }}
        run: bash ci-policy-samples/scripts/staging-access-test.sh "$STAGING_PROJECT"

      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-evidence-${{ github.sha }}
          path: artifacts-staging/
          retention-days: 30
